<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Tracker</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#2563eb">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:sans-serif;
    background:#111827;
    color:white;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
}

.card{
    background:#1f2937;
    padding:20px;
    border-radius:16px;
    margin-bottom:16px;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.big{
    font-size:2rem;
    font-weight:bold;
}

.progress{
    width:100%;
    height:20px;
    background:#374151;
    border-radius:10px;
    overflow:hidden;
    margin-top:10px;
}

.bar{
    height:100%;
    width:0%;
    background:#3b82f6;
}

input,select{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:none;
    border-radius:10px;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:16px;
}

.record{
    padding:10px;
    border-bottom:1px solid #374151;
}
</style>
</head>

<body>

<div class="container">

<h1>📚 Study Tracker</h1>

<div class="card">
<h2>今日の勉強時間</h2>
<div class="big" id="todayTime">0 分</div>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<div id="goalText">目標: 300分</div>
</div>

<div class="card">
<h2>勉強を記録</h2>

<select id="subject">
<option>現代国語</option>
<option>言語文化</option>
<option>数Ⅰ</option>
<option>数A</option>
<option>公共</option>
<option>歴史総合</option>
<option>生物基礎</option>
<option>論表</option>
<option>Ecom</option>
</select>

<input
type="number"
id="minutes"
placeholder="勉強時間(分)"
>

<button onclick="addStudy()">
記録する
</button>
</div>

<div class="card">
<h2>記録一覧</h2>
<div id="records"></div>
</div>

</div>

<script>

let records =
JSON.parse(
localStorage.getItem("records")
) || [];

function save(){
localStorage.setItem(
"records",
JSON.stringify(records)
);
}

function addStudy(){

const subject =
document.getElementById("subject").value;

const minutes =
Number(
document.getElementById("minutes").value
);

if(!minutes){
alert("時間を入力してください");
return;
}

records.unshift({
subject,
minutes,
date:new Date().toLocaleString()
});

save();
render();
}

function render(){

const recordsDiv =
document.getElementById("records");

recordsDiv.innerHTML="";

let total=0;

records.forEach(r=>{

total += r.minutes;

recordsDiv.innerHTML += `
<div class="record">
<b>${r.subject}</b>
${r.minutes}分
<br>
<small>${r.date}</small>
</div>
`;

});

document.getElementById("todayTime")
.textContent = total + " 分";

const goal=300;

const percent =
Math.min(total/goal*100,100);

document.getElementById("bar")
.style.width = percent + "%";
}

render();

if("serviceWorker" in navigator){
window.addEventListener("load",()=>{
navigator.serviceWorker.register(
"./service-worker.js"
);
});
}

</script>

</body>
</html>
